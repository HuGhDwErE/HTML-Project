<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Linking everything for the Login page-->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link rel="stylesheet" href="{{ url_for('static', filename='Stylesheet.css') }}" />
        <script defer src="{{ url_for('static', filename='ButtonWorker.js') }}"></script>
        <link rel="icon" type="image/x-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcgzo1WK8N1PcYh0JstIFeZxyuiH1sX6LHug&s" />
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
        <title>Login</title>
    </head>
    <body id="body">
        <div class="wrapper">
            <form id="login-form">
                <h1>Login</h1>

                <div class="input-box">
                    <input type="text" id="username" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <div class="remember-forgot">
                    <label><input type="checkbox" id="rememberMe">Remember me</label>
                </div>

                <button type="submit" class="btn">Login / Sign Up</button>

                <div class="register-link">
                    <p id="login-message">Create an account or log into an existing one.</p>
                </div>
            </form>
        </div>

        <script src="{{ url_for('static', filename='js/ButtonWorker.js') }}"></script>
    </body>
</html>
