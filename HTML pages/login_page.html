<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Linking everything for the Login page-->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link href="../Stylesheet.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href ="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcgzo1WK8N1PcYh0JstIFeZxyuiH1sX6LHug&s" />
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='//Stylesheet.css'>
        <title></title>
    </head>
    <body>
        <div class="wrapper"> 
            <form action="">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username"
                    required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password"
                    required>
                    <i class='bx bxs-lock-alt' ></i>
                </div>

                <div class="remember-forgot">
                    <label><input type="checkbox">Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">Login</button>

                <div class="register-link"></div>
                    <p>Don't have an account? <a href="#">Register</a></p>
            </form>
        </div>
    </body>
</html>
